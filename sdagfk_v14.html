const clone=x=>JSON.parse(JSON.stringify(x));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,Number.isFinite(+x)?+x:a));

const unique=a=>[...new Set(a)];
const RNAME={hp:'生命',qi:'真气',energy:'体力',food:'口粮',silver:'银两',herbs:'药材',material:'材料',favor:'人情',renown:'名望',virtue:'侠义',intel:'情报',medicine:'医术',lore:'学识',training:'修为',merit:'功勋',credit:'商誉'};

function newGame(job=0,seed=Date.now()>>>0,meta=newMeta(),challenge=0){
const s={version:VERSION,seed:seed||1,meta:clone(meta),job,challenge:clamp(challenge,0,2),name:'无名客',done:0,region:0,ended:false,end:null,

npcs:DATA.npcs.map(n=>({aff:5,trust:0,debt:0,stance:n.faction,alive:true,away:false,warning:0,relation:'相识',story:0,romance:false})),companions:[],command:'援攻',
faction:-1,factionRep:[0,0,0,0],sect:-1,sectState:{food:60,disciples:2,tension:10,split:false,party:[34,33,33],policy:{},allies:[],wars:[],votes:[],leader:false},
world:{order:50,freedom:50,prosperity:50},prices:Array(8).fill(1),visited:{},sites:[],rumors:[],seen:[],offered:null,queue:[],worldDone:[],delays:[],chains:DATA.chains.map(()=>({step:0,choices:[],end:-1})),cases:[-1,-1,-1],bounties:[],assets:[0,0,0,0,0,0],cargo:[],trades:{},inventory:[0,0,0],quotas:{},contracts:[],guard:0,finance:[],cover:'行商',secrets:0,realm:null,realmClears:[],battle:null,battles:[],trace:[],seq:0,

s.maxhp+=meta.talents[0]*6;s.r.hp=s.maxhp;s.maxqi+=meta.talents[1]*2;s.r.qi=s.maxqi;s.r.training+=meta.talents[2]*2;
if(job===0)s.r.training+=5;if(job===1)s.guard=1;if(job===2)s.r.medicine+=12;if(job===3)s.r.silver+=120;if(job===4)s.r.intel+=12;if(job===5){s.sect=0;s.r.merit=12;}
s.learned=unique([...s.learned,...meta.arts.filter(x=>Number.isInteger(x)&&DATA.skills[x])]);
if(meta.echo.boy){s.npcs[6].aff=25;s.npcs[6].trust=15;log(s,'前世回响',meta.echo.boy>=2?'少年的后人携旧剑而来，半枚铜钱终于相合。':'昔年少年已成为侠客，循半枚铜钱与你重逢。','echo:boy');s.r.favor+=5;}
if(meta.echo.enemy){s.world.order-=5;log(s,'宿敌来信','前世夺剑之人的后代已听说你重新入世。','echo:enemy');}
if(meta.echo.book){s.r.lore+=5;log(s,'封印裂痕','前世留在天书中的批注仍在，研读门槛已经降低。','echo:book');}
for(const i of meta.unfinished||[]){if(DATA.chains[i]){s.rumors.push('前世遗闻'+i);log(s,'未竟之缘',DATA.chains[i].name+'在前世未结，此世可沿旧闻重新查访。','chain:'+i);}}visit(s,0);log(s,'启程','第 '+meta.life+' 世，'+DATA.jobs[job].name+'入江湖。','life');return s;
}
function rng(s){let a=s.seed|0;a^=a<<13;a^=a>>>17;a^=a<<5;s.seed=a>>>0;return s.seed/4294967296;}
function log(s,type,text,chain='life',parent=null,data=null){const id=++s.seq;if(parent===null){const prev=[...s.trace].reverse().find(t=>t.chain===chain);parent=prev?prev.id:null;}s.trace.push({id,turn:s.done,type,text,chain,parent,data});return id;}
function gain(s,k,v){if(!(k in s.r))return;const before=s.r[k];s.r[k]=clamp(Math.round(before+v),-100000,k==='hp'?s.maxhp:k==='qi'?s.maxqi:1000000);if(k==='silver'&&v>0)s.stats.income+=v;}
function chapter(s){return Math.min(4,Math.floor(s.done/16)+1);}
function changeWorld(s,k,v){s.world[k]=clamp(s.world[k]+v,0,100);}
function visit(s,i){if(!Number.isInteger(i)||!DATA.regions[i])return false;s.region=i;const key=chapter(s)+':'+i;if(!s.visited[key]){s.visited[key]=true;const clue='访闻'+i;s.rumors=unique([...s.rumors,clue]);log(s,'传闻',DATA.regions[i].name+'本章首次到访：三个地点的线索已标在江湖志。','region:'+i);}return true;}
function canAct(s){return !s.ended&&!s.battle&&!s.offered&&s.done<64;}
function tick(s){s.done++;s.stats.turns=s.done;gain(s,'food',-1);gain(s,'energy',-2);if(s.sect>=0){s.sectState.food-=1;if(s.sectState.food<15)s.sectState.tension+=3;}
if(s.done%4===0){s.assets.forEach((level,i)=>{if(!level)return;if(i===0){gain(s,'silver',16*level);gain(s,'intel',level);}if(i===1)gain(s,'herbs',2*level);if(i===2)gain(s,'material',2*level);if(i===3)gain(s,'credit',level);if(i===4){gain(s,'lore',2*level);s.sectState.disciples+=level;}if(i===5)gain(s,'intel',2*level);});}
for(const c of s.contracts.filter(c=>!c.done&&c.due<=s.done)){c.done=true;gain(s,'silver',c.cost+c.fee+c.profit);gain(s,'credit',c.encounter&&c.guard<2?2:4);if(c.encounter){if(c.guard>=2)gain(s,'renown',3);log(s,'镖路险情',c.guard>=2?'护卫击退劫路者，名望+3；合同照常交割。':'遇袭后由受保商路接续运输；利润不减，商誉奖励降至2。','escort:'+c.id);}s.stats.escort++;s.stats.contracts++;if(c.kind===2)gain(s,'intel',5);if(c.kind===3){gain(s,'virtue',5);gain(s,'favor',3);}if(c.kind===1)s.factionRep[1]+=4;log(s,'镖单结算',c.name+'：返还成本 '+c.cost+'、运费 '+c.fee+'；净利润 '+c.profit+'。','escort:'+c.id);}
for(const f of s.finance.filter(f=>!f.done&&f.due<=s.done)){f.done=true;gain(s,'silver',f.kind==='loan'?-f.amount:f.amount);gain(s,'credit',3);log(s,'金融契约',f.kind==='loan'?'贷款到期偿还'+f.amount+'银两。':'投资到期返还'+f.amount+'银两。','finance:'+f.id);}for(const d of s.delays.filter(d=>!d.done&&d.due<=s.done)){d.done=true;gain(s,d.key,d.value);log(s,'迟来的回响',d.text,d.chain,d.parent);}
if(s.done%16===0){const ch=s.done/16;let available=DATA.worlds.map((w,i)=>({w,i})).filter(x=>x.w.chapter===ch&&!s.worldDone.includes(x.i));const picked=available[Math.floor(rng(s)*available.length)];if(picked)s.queue.push({kind:'world',id:picked.i,source:'第 '+s.done+' 回合大势 / 阵营 '+(DATA.factions[s.faction]||'江湖散人')});}
if(s.sect>=0&&s.sectState.tension>=75&&!s.sectState.split){s.sectState.split=true;s.prices=s.prices.map(p=>clamp(p*1.12,.6,1.8));s.queue.push({kind:'split',id:0,source:'缺粮或内部矛盾达到分裂阈值'});}
}
function crisis(s){const bad=[];for(const k of ['silver','qi','energy','food','herbs','material','favor','renown','virtue','intel','medicine','lore','training','merit','credit'])if(s.r[k]<0)bad.push(k);
for(const k of bad){s.r[k]=k==='energy'?15:k==='food'?8:0;s.stats.crises++;if(['energy','food','herbs','material','qi'].includes(k))s.r.hp-=8;else if(k==='silver')s.r.credit=Math.max(0,s.r.credit-8);else s.world.order=Math.max(0,s.world.order-2);log(s,'资源危机',RNAME[k]+'跌至负值：本行动仅处罚一次，已恢复安全下限。可休整、帮工或义诊恢复。','crisis:'+s.seq);}
s.r.hp=clamp(s.r.hp,0,s.maxhp);s.r.qi=clamp(s.r.qi,0,s.maxqi);s.r.energy=clamp(s.r.energy,0,100);s.r.food=clamp(s.r.food,0,180);
for(const n of s.npcs){n.aff=clamp(n.aff,-100,100);n.trust=clamp(n.trust,-100,100);n.debt=clamp(n.debt,-20,20);}
if(s.r.hp<=0){s.battle=null;s.offered=null;s.queue=[];finish(s,'身陨江湖');return;}promote(s);
}
function promote(s){if(s.ended||s.battle||s.offered)return;if(s.queue.length){s.offered=s.queue.shift();return;}if(s.done>=64)finish(s);}

function eventView(){const o=G.offered;if(!o)return '';let name,text,choices;if(o.kind==='event'){const e=DATA.events.find(e=>e.id===o.id);name=e.name;text=e.text;choices=[[e.a,'体力−4 · 侠义+3 · 名望+2；数回合后回响'],[e.b,'银两−22 · 情报+2 · 人情+2；数回合后回响']];}else if(o.kind==='world'){const w=DATA.worlds[o.id];name=w.name;text=w.desc+' 当前身份：'+(DATA.factions[G.faction]||'江湖散人')+'。你的决定会写回市场、人物立场与宗门矛盾。';choices=[['救济与调停','银两−45 · 侠义+7 · 名望+5 · 民生+9'],['依阵营主张介入','体力−8 · 名望+9 · 阵营关系+10；秩序或自由+8'],['调查幕后，暂缓站队','情报+6 · 学识+3 · 秩序−3']];}else{name='一座山门，三条道路';text='粮仓与议事堂的裂痕已无法掩盖。宗门发生分裂，商路因此涨价。';choices=[['调停并补足粮仓','银两−65 · 宗门粮草+35 · 矛盾降至25'],['支持改革派','重设议席、粮草与矛盾，自由+8'],['离开宗门','失去宗门职位，名望+8 · 天下秩序−8']];}return `<section class="card event" aria-label="待处理事件"><div class="cardhead"><div><div class="eyebrow">江湖来信 · 请先落定此事</div><h2>${esc(name)}</h2></div>${tag(o.kind==='world'?'天下大势':'因果选择','gold')}</div><p class="story">${esc(text)}</p><div class="choices">${choices.map(([n,c],i)=>btn(`${esc(n)}<small>${esc(c)} · 此次回应不另扣回合</small>`,'choice',[i],i===0?'primary':'')).join('')}</div><details><summary>为什么遇到此事？</summary><small>${esc(o.source)}。所有后果均在本地因果记录中留痕。</small></details></section>`;}
function careerView(){const g=G;return `${spyView()}${section('六条道路','职业可转换，修行可兼容')}<div class="grid">${DATA.jobs.map((j,i)=>`<article class="card"><div class="cardhead"><h3>${j.name}</h3>${tag(g.job===i?'当前道路':'可转修')}</div><p class="description">${j.intro}</p><small>职业阅历 ${g.jobXP[i]} · 专属事件 ${g.seen.filter(id=>DATA.events.find(e=>e.id===id&&e.cat==='job'&&e.scope===i)).length}/6</small>${j.talents.map((t,k)=>`<div class="row spread" style="margin-top:8px"><span>${k+1}. ${t}</span>${btn(g.jobTier[i]>k?'已领悟':'领悟 · 1回合','tier',[i],'small',blocked()||g.jobTier[i]!==k||g.jobXP[i]<[4,10,18][k]||g.r.renown<[0,8,18][k])}</div><small>需阅历${[4,10,18][k]}、名望${[0,8,18][k]}；${RNAME[j.stat]}+6${i===1?'、护卫+1':i===5?'、弟子+2':''}</small>`).join('')}<hr class="divider">${btn(g.job===i?'正在修行':'转入此道 · 1回合','career',[i],g.job===i?'':'primary',blocked()||g.job===i)}</article>`).join('')}</div>`;}
function spyView(){return `<div class="card"><div class="cardhead"><h3>密探的另一张面孔</h3>${tag('密报 '+G.secrets)}</div><p class="description">伪装不会改变人物本来的身份。需情报12才能潜入；情报 + 密探天赋×8 + 合适身份15 + 无相面具12 达到30即成功。失败受伤10、目标关系−6，仍安全撤出。成功银+35、情报+5、学识+3。</p><div class="row">${['行商','医徒','门人'].map(c=>btn(c,'cover',[c],G.cover===c?'active small':'small',G.ended||!!G.battle)).join('')}</div><small>行商需商誉20；医徒需医术20；门人需已入宗门。</small><div class="row" style="margin-top:12px">${DATA.factions.map((f,i)=>btn('潜入'+f+' · 1回合','infiltrate',[i,G.cover],'small',blocked()||G.r.intel<12)).join('')}</div></div>`;}
function realmView(){const g=G,r=g.realm;if(r){const d=DATA.realms[r.id],type=roomType(g),labels={机关:r.id===0?['收剑向东','拔剑向西','以火照门']:r.id===1?['报出本名','不留姓名','伪造官印']:r.id===2?['带走旧债','遗忘前事','记事释债']:['洗根以甘草中和','混用剧毒','直接服药'],战斗:['正面接战','结阵接战 · 初始护盾15','绕后迎战 · 2轮身法，体力额外−3'],宝藏:['取银与材料','取药与银','抄录秘闻'],人物:['请教专长','结下一份人情','切磋武学'],命运:['寿限换悟性','银两换技艺','婉拒馈赠'],休整:['静坐 · 生命+20、真气+25、体力+12','补给 · 生命+15、真气+8、体力+20、粮+15','疗伤 · 生命+40、真气+8、体力+8'],首领:['挑战守关者','整队应敌 · 初始护盾15','绕阵突入 · 2轮身法，体力额外−3']}[type]||['离开'];return `<section class="card event"><div class="cardhead"><h2>${d.name}</h2>${tag('第'+(r.depth+1)+'室 / 共7室')}</div><p class="story">${type}房 · ${type==='命运'?'有些馈赠，代价将伴随此世。':type==='首领'?'最深处的守关者已经醒来。':type==='战斗'?'守卫正在接近，请做好战斗准备。':d.hint}</p><p class="hint">提示：${d.hint} 专长${RNAME[d.stat]}≥22时可直接破解。当前未兑现战利品：${r.loot}银两。</p><div class="choices">${labels.map((l,i)=>btn(l+'<small>推进耗1回合'+(type==='命运'?(i===0?' · 生命上限−12（本世），修为+12、宝藏+70':i===1?' · 银两−35，专长+6':' · 学识+3'):'')+'</small>','delve',[i],i===0?'primary':'',blocked())).join('')}</div><div class="row" style="margin-top:15px">${btn('安全撤离 · 保留50%宝藏','retreatRealm',[],'ghost',!!g.battle||!!g.offered||g.ended)}</div></section>`;}return `${section('秘境寻幽','房间次序依种子生成')}<div class="grid">${DATA.realms.map((d,i)=>`<article class="card"><div class="cardhead"><h3>${d.name}</h3>${tag(g.realmClears.includes(i)?'已通关':DATA.regions[d.region].name)}</div><p class="description">7间房：战斗、宝藏、机关、人物、命运、休整与首领。<br>${d.hint}</p><small>专长：${RNAME[d.stat]} · 入内1回合，每次探索1回合。可中途撤离。</small><div class="row" style="margin-top:12px">${btn('前往秘境','move',[d.region],'small',!!g.battle||g.ended)}${btn('进入 · 1回合','enterRealm',[i],'primary',blocked()||g.region!==d.region)}</div></article>`).join('')}</div>`;}
function journalView(){const g=G;const menu=subnav([['quests','长篇因果'],['rumors','传闻与悬案'],['chapters','四幕人生'],['trace','因果回放']]);if(sub==='trace')return menu+traceView();if(sub==='chapters')return menu+chaptersView();if(sub==='rumors')return menu+rumorsView();return menu+section('十六卷江湖书','每一节点耗1回合')+`<div class="grid">${DATA.chains.map((c,i)=>{const p=g.chains[i],need=chainNeed(g,i);return `<article class="card"><div class="cardhead"><h3>${c.name}</h3>${tag(p.end>=0?'已结卷':p.step+'/5',p.end>=0?'gold':'')}</div><div class="chainsteps">${c.steps.map((_,j)=>`<span class="${j<p.step?'done':''}"></span>`).join('')}</div><p class="description">${esc(p.end>=0?c.outcomes[p.end]:c.steps[p.step])}</p>${p.end>=0?`<small>获得：${i===0?(p.end===0?'沈氏传剑谱':p.end===1?'残照剑':'两派和解书'):c.item} · 本世分支已落定</small>`:`<small>${need||'线索已齐，可推进'} · 下一站：${DATA.regions[c.locs[p.step]].name}</small><div class="choices" style="margin-top:10px">${(p.step===4?c.outcomes:['助人留证','协商探查','强行取证']).map((n,k)=>btn(esc(n)+(p.step<4?`<small>${['银两−10 · 侠义+3','情报+3','侠义−3 · 修为+2'][k]}</small>`:''),'chainAct',[i,k],k===0?'primary':'',blocked()||!!need)).join('')}</div>${g.region!==c.locs[p.step]?`<div style="margin-top:8px">${btn('赶往下一站 · 免费','move',[c.locs[p.step]],'small',!!g.battle||!!g.realm||g.ended)}</div>`:''}`}<details><summary>故事路径与共同代价</summary><p class="description">${c.locs.map(x=>DATA.regions[x].name).join(' → ')}。每步学识+2、名望+2，体力额外−3；第五步决定三种结局。尚未完结的故事保留于前世记录与收藏中，下一世需重新寻找今生证人。</p></details></article>`;}).join('')}</div>`;}
function rumorsView(){const g=G;return section('传闻簿',`${g.sites.length}/24 处地点已探`)+`<div class="card"><p>无名剑冢的开启线索：青石镇旧城井、天剑山悬崖石刻、忘川前世石碑，以及断剑归宗初见。</p><div class="row" style="margin:12px 0">${[[0,'井中姓名'],[10,'山崖石刻'],[16,'前世碑文']].map(([i,n])=>tag(n+(g.sites.includes(i)?' · 已得':' · 未得'),g.sites.includes(i)?'gold':'')).join('')}${tag('断剑'+(g.chains[0].step?' · 已见':' · 未见'))}</div><details><summary>全部地点记录</summary><div class="glossary">${DATA.regions.flatMap((r,i)=>r.sites.map((n,j)=>`<small>${g.sites.includes(i*3+j)?'●':'○'} ${r.name} · ${n}</small>`)).join('')}</div></details></div>${section('三宗悬案','九种结案走向')}<div class="grid">${DATA.cases.map((c,i)=>`<article class="card"><div class="cardhead"><h3>${c.name}</h3>${tag(g.cases[i]>=0?'已结案':'调查中')}</div><p class="description">取证地点：${c.sites.map(x=>DATA.regions[Math.floor(x/3)].sites[x%3]+(g.sites.includes(x)?' ✓':'')).join('、')}。</p>${g.cases[i]>=0?`<p>${esc(c.truth)}</p><small>处置：${['公开证据','调停赔偿','封存交易'][g.cases[i]]}</small>`:`<div class="choices">${['公开证据 · 侠义+6、秩序+5','调停赔偿 · 人情+8、民生+5','封存交易 · 银+70、侠义−6'].map((t,j)=>btn(t,'investigate',[i,j],'',blocked()||!c.sites.every(x=>g.sites.includes(x)))).join('')}</div>`}</article>`).join('')}</div>${section('悬赏行程')}<div class="card">${DATA.bounties.map((b,i)=>`<div class="row spread" style="margin:10px 0"><span>${b.name} · ${DATA.regions[b.region].name} · 截至${b.due}</span>${tag(g.bounties.includes(i)?'已讨伐':g.done>=b.due?'已过期':'可揭榜')}</div>`).join('')}</div>`;}
function chaptersView(){return section('六十四回合，四幕人生')+`<div class="grid">${['初入江湖','风起云涌','天下纷争','天命归途'].map((n,i)=>`<article class="card"><div class="eyebrow">第${i+1}幕 · ${i*16+1}—${i*16+16}回合</div><h3>${n}</h3><p class="description">${['探索至少2个地点。','解锁任意职业天赋，或一位人物信任达15。','完成2项任务，或经历2次世界事件。','完成4项任务，或名望达到80。'][i]}</p><small>每幕末会触发一项符合章节的天下大势。目标奖励：银两50、学识3。</small><div style="margin-top:10px">${btn(G.chapterClaims.includes(i+1)?'已领取':'领取章回奖励 · 免费','chapterReward',[i+1],'primary',G.ended||G.chapterClaims.includes(i+1)||G.done<(i+1)*16)}</div></article>`).join('')}</div><div class="card" style="margin-top:16px"><h3>归途安排</h3><p class="description">最后十六回合可选择归隐、牺牲或顺其自然；结局仍需相应条件。终局评分不因选择归隐而封顶。</p><div class="row">${['顺其自然','归隐','牺牲'].map(n=>btn(n,'endChoice',[n],G.endChoice===n?'active':'',G.ended||G.done<48)).join('')}</div></div>`;}
function traceView(){const chains=unique(G.trace.map(t=>t.chain));const entries=G.trace.filter(t=>!traceFilter||t.chain===traceFilter);return section('选择之后，还有回声','本地只读记录')+`<div class="card"><label>因果链筛选　<select id="traceFilter"><option value="">全部记录</option>${chains.map(c=>`<option value="${esc(c)}" ${c===traceFilter?'selected':''}>${esc(c.startsWith('chain:')?DATA.chains[+c.split(':')[1]]?.name||c:c.startsWith('npc:')?DATA.npcs[+c.split(':')[1]]?.name||c:c)}</option>`).join('')}</select></label><p class="description">同一链保留父记录编号，可追踪选择 → 延迟回响 → 世界变化。最近200条显示于此；完整记录在导出文件内。</p>${entries.slice(-200).reverse().map(t=>`<div class="trace-link"><span>${t.turn}回合</span><div><strong>${esc(t.type)}</strong> <small>#${t.id}${t.parent?' ← #'+t.parent:''}</small><p>${esc(t.text)}</p>${t.data?.source?`<small>触发：${esc(t.data.source)}</small>`:''}</div></div>`).join('')}</div>`;}
function peopleView(){const g=G;return section('十二个人，十二种江湖','先到其所在地区相见')+`<div class="notice">好感决定接近，信任决定托付，人情债记录付出；立场影响天下事件。同行最多2人。原则冲突会先劝告，三次后离队，可在故地修复关系。情缘需主动选择。</div><div class="grid">${DATA.npcs.map((n,i)=>{const r=g.npcs[i],here=n.region===g.region;return `<article class="card"><div class="cardhead"><div class="npc-title"><div class="portrait">${n.name[0]}</div><div><h3>${n.name}</h3><small>${n.job} · ${DATA.regions[n.region].name}</small></div></div>${tag(r.relation,g.companions.includes(i)?'gold':'')}</div><p class="description">${n.goal}。<br>原则：${n.principle} · 立场：${DATA.factions[r.stance]}</p><div class="numbers"><div><b>${r.aff}</b><small>好感</small></div><div><b>${r.trust}</b><small>信任</small></div><div><b>${r.debt}</b><small>欠你的人情</small></div></div>${r.warning?`<div class="hint warning">${r.away?'已离队':'已有'+r.warning+'次劝告'}：不赞同违背原则的行动，可修复。</div>`:''}<div class="row">${btn('交谈 · 1回合','relation',[i,'交谈'],'small',blocked()||!here||r.away)}${btn('赠礼 · 银24','relation',[i,'赠礼'],'small',blocked()||!here||r.away)}${btn('修复 · 银30','relation',[i,'修复'],'small',blocked()||!here)}${btn(g.companions.includes(i)?'暂别 · 免费':'邀请同行','invite',[i],'small primary',g.ended||!!g.battle||!!g.offered||(!g.companions.includes(i)&&(!here||r.aff<15||r.trust<5||r.away||g.companions.length>=2||r.relation==='宿敌')))}</div><details><summary>个人故事 ${r.story}/3 · 专属武学「${n.art}」</summary><p class="description">${esc(n.steps[Math.min(2,r.story)])}</p><small>需好感${10+r.story*10}，每一步选择都会改变关系。完成三步获得专属武学。</small><div class="choices">${['支持其目标 · 银−15 · 好感+7、信任+8','说服改换阵营 · 情报+3 · 信任+8','以人情取利 · 银+35 · 信任−3'].map((x,k)=>btn(x,'relation',[i,'story',k],'small',blocked()||!here||r.away||r.story>=3||r.aff<10+r.story*10)).join('')}</div></details><details><summary>关系选择 · 需要信任15</summary><div class="row">${['知己','结拜','师徒','宿敌','情缘'].map(mode=>btn(mode,'relation',[i,mode],'small',blocked()||!here||r.trust<15||r.away)).join('')}</div><small>每次关系选择耗1回合；关系互斥。情缘可选，不影响其他道路。</small></details>${!here?`<div style="margin-top:10px">${btn('去相见 · 免费','move',[n.region],'small ghost',g.ended||!!g.battle||!!g.realm)}</div>`:''}</article>`;}).join('')}</div>`;}
function artsView(){const g=G;return `${subnav([['skills','流派与武学'],['replay','战斗复盘'],['items','神兵收藏']])}${sub==='replay'?replayView():sub==='items'?itemsView():section('一身武学，各有所归','切换流派免费')+`<div class="grid four">${DATA.styles.map((n,i)=>`<article class="card"><h3>${n}</h3><p class="description">${['破甲单锋 / 剑气群攻','自护反击 / 共护支援','叠毒爆发 / 封穴控制','长春续战 / 急救援护'][i]}</p>${btn(g.style===i?'当前流派':'切换流派','style',[i],g.style===i?'active':'small',!!g.battle||g.ended)}<div style="margin-top:8px">${btn('天赋 '+g.styleTalents[i]+'/3','styleTalent',[i],'small',blocked()||g.styleTalents[i]>=3||g.r.training<10+g.styleTalents[i]*10)}</div><small>升级需修为${10+g.styleTalents[i]*10}，耗1回合；本派修习增益与战术被动提高。</small></article>`).join('')}</div><div class="hint">连携：流云步→清风剑→断月斩；玄武阵→护体真气→金钟震荡；毒针→封穴→千蛛万毒手；援护→回春诀→同心破阵。连续三次正确出招使末击×1.6；真气消耗与冷却限制重复使用。</div><div class="grid">${DATA.skills.map((a,i)=>`<article class="card"><div class="cardhead"><h3>${a.name}</h3>${tag(DATA.styles[a.style])}</div><p class="description">真气 ${a.cost} · ${({swift:'身法增益3轮与格挡',strike:'直接伤害',break:'无视护甲的重击',pierce:'穿透护甲',aoe:'攻击全部敌人',counter:'格挡并反击，最多3层',guard:'格挡与护盾',shield:'护体与队友增益',qi:'恢复真气13',inner:'伤害并削弱护甲',poison:'附加毒伤，最多5层',stun:'封穴跳过一次行动，敌方每三轮抗封穴',venom:'按中毒层数追加伤害',cover:'攻击并援护',heal:'恢复生命与同伴生命',cleanse:'净化毒伤并恢复生命'}[a.effect])}。</p>${btn(g.learned.includes(i)?'已掌握':'学习 · 银20 / 1回合','learn',[i],'small primary',blocked()||g.learned.includes(i)||g.r.training<8||g.r.silver<20)}${[1,11,19].includes(i)?`<details><summary>专属领悟 · 互斥选择</summary>${g.mods[i]?`<p>已选择：${g.mods[i]}</p>`:`<div class="row">${({1:['单锋','剑气'],11:['自护','共护'],19:['长春','急救']}[i]).map(v=>btn(v,'modify',[i,v],'small',blocked()||!g.learned.includes(i)||g.r.training<18)).join('')}</div><small>需修为18，耗1回合。单锋伤害+30%；剑气群攻；自护多12盾；共护恢复同伴；长春3轮回血；急救本战一次濒死恢复。</small>`}</details>`:''}</article>`).join('')}</div><div class="card" style="margin-top:16px"><h3>天命之门</h3><p class="description">第49回合起可挑战终局双首领。胜利获得破命之印，与天书线相连；死亡仍结束本世。</p>${btn('挑战天命 · 1回合','finalChallenge',[],'accent',blocked()||g.done<48||g.items.includes('破命之印'))}</div>`}`;}
function battleView(){const g=G,b=g.battle;return `<section class="battle"><div class="cardhead"><div><div class="eyebrow">人生回合已计入 · 战斗轮次独立</div><h2>剑已出鞘</h2></div>${tag('第 '+b.round+' 轮')}</div><div class="grid">${b.enemies.map((e,i)=>`<div class="enemy ${i===target?'selected':''} ${e.hp<=0?'dead':''}" role="button" tabindex="0" data-a="target" data-args="[${i}]"><strong>${esc(e.name)}</strong> <small>${e.hp}/${e.max}</small>${meter(e.hp,e.max)}<small>${['每3轮蓄势重击','偶数轮增强护甲','逐轮施毒','无视格挡','每3轮恢复9生命'][e.mode]} · 毒${e.poison} ${e.stun?'· 封穴':''}</small></div>`).join('')}</div><p style="margin:12px 0"><small>你：生命 ${Math.round(g.r.hp)} · 真气 ${Math.round(g.r.qi)} · 护盾 ${b.shield} · 毒层 ${b.poison} ${g.companions.length?' / 同伴生命 '+b.allyHP.join('、'):''}</small></p><div class="row">${['援攻','守护','救治'].map(c=>btn(c,'command',[c],b.command===c?'active small':'small')).join('')}${btn('撤离战斗','flee',[],'small')}</div><div class="battle-log">${b.log.length?b.log.slice(-2).map(l=>`<p><b>第${l.round}轮 · ${l.skill} → ${l.target} / 同伴${l.command}</b><br>${l.lines.map(esc).join('<br>')}</p>`).join(''):'选择敌人作为目标。技能会显示耗气与冷却；同伴先行动，随后敌方依次行动。'}</div><div class="fight-skills">${btn('普通攻击<small>恢复真气3</small>','battleAct',[-1,target],'primary')}${g.learned.map(i=>{const a=DATA.skills[i];return btn(a.name+`<small>耗气${a.cost} · ${b.cool[i]?'冷却'+b.cool[i]+'轮':'可用'}</small>`,'battleAct',[i,target],'',g.r.qi<a.cost||(b.cool[i]||0)>0);}).join('')}</div><div class="row" style="margin-top:12px">${btn(autoTimer?'暂停自动战斗':'自动战斗','auto',[],'small')}<small>自动选择可用攻击或回复；可随时暂停。</small></div></section>`;}
function replayView(){return section('每一轮，都有来由','只读复盘')+`<div class="card">${G.battles.length?G.battles.slice().reverse().map((b,i)=>`<details ${i===0?'open':''}><summary>第${b.turn}回合 · ${b.enemies.map(e=>e.name).join('、')} · ${b.retreat?'撤离':b.win?'胜利':'战败'} · ${b.round-1}轮</summary><div class="hint">真气花费 ${b.spent}；重复护盾 ${b.wasted} 次；最大群攻 ${b.bestAoE}。${b.wasted?'下次可在护盾消耗后再补护体。':'护体没有明显重复浪费。'}${b.spent>30?'长战可用普通攻击或归元息补气。':''}</div>${b.log.map(l=>`<details><summary>第${l.round}轮 · ${l.skill} → ${l.target} · 队令${l.command}</summary><p class="description">${l.lines.map(esc).join('<br>')}<br>回合末生命${l.hp} / 真气${l.qi}</p></details>`).join('')}</details>`).join(''):'<div class="empty">尚无已结束战斗。可到青石镇揭榜，或深入秘境。</div>'}</div>`;}
function itemsView(){return section('物有来历，剑有归处')+`<div class="card"><h3>神兵之性</h3><p class="description">残照剑：生命低于40%时攻击提升18%、忽略护甲。取得途径：断剑归宗。<br>残灯护符：援护自身或同伴时获得反击层数，上限3。取得途径：残灯天书。<br>兵器强化最高三级；可在铁匠铺制造修复。</p><div class="row">${tag('强化 '+G.weapon+'/3')}${tag('完好度 '+G.repair+'/100')}</div></div><div class="grid">${G.items.map(n=>`<div class="card"><h3>${esc(n)}</h3><small>本世收藏 · 事件与任务的见证</small></div>`).join('')||'<div class="empty">探访地点或完成任务，便会获得有来历的物件。</div>'}</div>`;}
function worldView(){const menu=subnav([['factions','天下阵营'],['sect','宗门议事'],['trade','商贸押镖'],['assets','六业经营']]);return menu+(sub==='sect'?sectView():sub==='trade'?tradeView():sub==='assets'?assetView():factionView());}
function factionView(){const g=G;return section('天下四局，立场各异')+`<div class="card"><div class="grid three">${Object.entries(g.world).map(([k,v])=>`<div><small>${{order:'秩序',freedom:'自由',prosperity:'民生'}[k]}</small><h3>${v}/100</h3>${meter(v)}</div>`).join('')}</div></div><div class="grid">${DATA.factions.map((n,i)=>`<article class="card"><div class="cardhead"><h3>${n}</h3>${tag('关系 '+g.factionRep[i])}</div><p class="description">${['维持秩序：联盟、讨伐与大会。事务增加秩序、功勋。','观测命数：官职、贡镖与天书。事务增加学识、情报与秩序。','打破旧制：暗线、伪装与地下贸易。事务增加情报与自由，但秩序略降。','护持民生：赈灾、义诊与地方治理。事务增加侠义与民生。'][i]}</p><div class="row">${btn(g.faction===i?'当前阵营':'加入 · 1回合','joinFaction',[i],'small',blocked()||g.faction===i)}${btn('阵营事务 · 1回合','factionWork',[i],'primary',blocked()||g.faction!==i)}</div><small>事务：银+28、阵营关系+8、名望+3；体力额外−6。</small></article>`).join('')}</div>${section('十二种天下大势','按章择一，四幕各有一场')}<div class="card">${DATA.worlds.map((w,i)=>`<details><summary>第${w.chapter}幕 · ${w.name} ${g.worldDone.includes(i)?'✓':''}</summary><p class="description">${w.desc}</p></details>`).join('')}</div>`;}
function sectView(){const g=G,q=g.sectState;if(g.sect<0)return section('八派山门')+`<div class="grid">${DATA.sects.map((n,i)=>`<article class="card"><h3>${n}</h3><p class="description">可参与粮草、税收、联盟与继承议事；内部有守旧、改革、强硬三派。</p>${actionButton('拜入山门 · 1回合','joinSect',[i],'primary')}</article>`).join('')}</div>`;return section(DATA.sects[g.sect]+' · 议事堂',q.leader?'你已接任掌门':'弟子参议')+`<div class="card"><div class="numbers"><div><b>${q.food}</b><small>粮草</small></div><div><b>${q.disciples}</b><small>弟子</small></div><div><b>${q.tension}</b><small>内部矛盾 / 75引发分裂</small></div></div><div class="row">${['守旧派','改革派','强硬派'].map((n,i)=>btn(n+' 支持'+q.party[i]+' · 游说','lobby',[i],'small',blocked())).join('')}</div><p class="description">游说耗1回合、人情2，目标支持+12、功勋+4。表决需至少两席权重达到18；权重来自派系支持、议题偏好、功勋、名望和同阵营人物信任。</p><small>联盟：${q.allies.map(i=>DATA.sects[i]).join('、')||'无'} · 交战：${q.wars.map(i=>DATA.sects[i]).join('、')||'无'}</small></div><div class="grid">${[['税收','降税利民：民生+7，银−20'],['粮草','补足粮仓：粮+35，银−25，矛盾−12'],['外交','与邻派结盟，贸易价格下降'],['开放武学','自由+8，弟子+3，学识+5'],['继承','获推为掌门，开启掌门结局'],['战争','功勋+10，矛盾+18，秩序−10；同伴可能劝告'],['停战','结束战争，矛盾−20，秩序+8']].map(([p,d])=>`<article class="card"><h3>${p}</h3><p class="description">${d}</p><small>预估三席权重：${voteWeights(g,p).join(' / ')}</small><div style="margin-top:10px">${actionButton('提交议案 · 1回合','council',[p],'primary')}</div></article>`).join('')}</div><div class="card" style="margin-top:16px"><h3>议事记录</h3>${q.votes.slice(-10).reverse().map(v=>`<p class="description">第${v.turn}回合 · ${v.policy} · ${v.weights.join('/')} · ${v.pass?'通过':'未通过'}</p>`).join('')||'<small>尚无提案。</small>'}</div>`;}
function tradeView(){const g=G;if(routeTo===null||routeTo===g.region)routeTo=(g.region+1)%8;const far=Math.min(Math.abs(routeTo-g.region),8-Math.abs(routeTo-g.region))>1;return section('镖旗所至，承诺必达')+`<div class="notice">受保合同在3—4回合后归还货本100与运费10，并支付至少20净利润；劫路风险影响额外名誉而不吞没保底。每章每类配额有限，回合不足时不能接新镖。押运期间可行动，免费移动不推进交割。</div><div class="card"><label>路线：${DATA.regions[g.region].name} → <select id="routeTo">${DATA.regions.map((r,i)=>i!==g.region?`<option value="${i}" ${i===routeTo?'selected':''}>${r.name}</option>`:'').join('')}</select></label><p class="description">近程3回合，远程4回合且额外净利+8。运输由镖队执行，途中你可以前往别处。</p></div><div class="grid">${['普通商镖','官府贡镖','秘密暗镖','江湖义镖'].map((n,i)=>`<article class="card"><div class="cardhead"><h3>${n}</h3>${tag('净利 '+(20+[15,40,20,0][i]+g.guard*3+g.jobTier[1]*4+(far?8:0)))}</div><p class="description">${['无门槛，常规商誉+4；遇险且护卫不足时+2。','需司天监关系10；交割后朝廷关系+4。','需情报10；交割后情报+5。','需侠义10；交割后侠义+5、人情+3。'][i]}</p><small>${escortNeed(g,i,routeTo)||('可签约 · 现付110银 · '+(far?4:3)+'回合后交割')}</small><div style="margin-top:12px">${btn('签约 · 1回合','escort',[i,routeTo],'primary',blocked()||!!escortNeed(g,i,routeTo))}</div></article>`).join('')}</div><div class="card" style="margin-top:16px"><h3>在途与已交割</h3>${g.contracts.slice(-8).reverse().map(c=>`<p class="description">${c.name} · ${c.done?'已交割':'第'+c.due+'回合交割'} · ${DATA.regions[c.from].name}出发 · 净利${c.profit}</p>`).join('')||'<small>尚无合同。</small>'}</div>${financeView()}${section('市集有限供需','买卖各耗1回合')}<div class="grid three">${['丝绸','药香','铁砂'].map((n,i)=>`<article class="card"><h3>${n}</h3><p class="description">持有 ${g.inventory[i]} · 本地本章余量 ${3-(g.trades[chapter(g)+':'+g.region+':'+i]||0)}</p><div class="choices">${btn('买入 '+price(g,i,true)+'银','trade',[i,true],'',blocked()||g.r.silver<price(g,i,true)||(g.trades[chapter(g)+':'+g.region+':'+i]||0)>=3)}${btn('卖出 '+price(g,i,false)+'银','trade',[i,false],'',blocked()||g.inventory[i]<=0)}</div></article>`).join('')}</div>`;}
function financeView(){const g=G,active=g.finance.find(f=>!f.done),debt=g.chains[14].end>=0?165:185;return `<div class="card"><h3>商会金融契约</h3><p class="description">融资获得150银，第8回合后偿还${debt}；完成商会契约故事后享有较低融资成本。合资投入100银，8回合后返还116。每次只能有一份在途金融契约，移动不能加速到期；偿还不足会触发一次银两危机。</p>${active?`<p class="hint">${active.kind==='loan'?'贷款':'投资'}：第${active.due}回合${active.kind==='loan'?'偿还':'返还'}${active.amount}银。</p>`:''}<div class="row">${btn('融资 · 商誉20 / 1回合','financeAct',['loan'],'small',blocked()||!!active||g.r.credit<20||g.done+8>64)}${btn('合资 · 商誉30 / 1回合','financeAct',['invest'],'small',blocked()||!!active||g.r.credit<30||g.r.silver<100||g.done+8>64)}</div></div>`;}
function assetView(){return section('六业在身，各有所用','最多两级，每四回合结算')+`<div class="grid">${DATA.assets.map((a,i)=>`<article class="card"><div class="cardhead"><h3>${a.name}</h3>${tag('等级 '+G.assets[i]+'/2')}</div><p class="description">${a.desc}二级将周期产出翻倍。</p><div class="row">${btn(G.assets[i]>=2?'已满级':(G.assets[i]?'升级':'置办')+' · '+a.cost*(G.assets[i]+1)+'银','buildAsset',[i],'small primary',blocked()||G.assets[i]>=2||G.r.silver<a.cost*(G.assets[i]+1))}${btn(['听客谈闻','配药疗伤','铸造修复','训练护卫','教习研读','购买密报'][i]+' · 1回合','assetAction',[i],'small',blocked()||!G.assets[i])}</div><small>${['客谈情报+6，另触发本地未经历事件。','药材−2，生命+30、真气+20、医术+3。','每级耗材料4，兵器最高3级；完好度恢复100。','护卫最高5级，商誉+4，提高押镖额外奖励。','学识+6、弟子+2、功勋+3。','银−25，情报+8、材料+2。'][i]}</small></article>`).join('')}</div>`;}
function archiveView(){return `${subnav([['lives','历代人生'],['endings','终局图鉴'],['coverage','策划对照'],['settings','存档与说明']])}${sub==='endings'?endingsView():sub==='coverage'?coverageView():sub==='settings'?settingsView():livesView()}`;}
function livesView(){const g=G,history=g.meta.history;return section('百世因果图','评分上限1000')+`<div class="card"><div class="row spread"><div><small>当前综合成就</small><div class="large-score">${sum(scores(g))}<span style="font-size:16px"> /1000</span></div></div><div>${tag('可用继承点 '+g.meta.points,'gold')}<p class="description">${g.meta.life}世 · 收藏${g.meta.collection.length} · 荣誉${g.meta.titles.length}</p></div></div>${scores(g).map((v,i)=>`<div class="scorebar"><span>${SCORE_NAMES[i]}</span><div class="progress"><i style="width:${v/SCORE_CAPS[i]*100}%"></i></div><span>${v}/${SCORE_CAPS[i]}</span></div>`).join('')}<details><summary>评分与继承规则</summary><p class="description">等级：0—199江湖过客、200—399初露锋芒、400—599一方豪侠、600—799天下闻名、800—949一代宗师、950—1000百世传说。银两存量不直接计分；同类活动均有封顶。继承点=向下取整(分数/100)+1，部分跨世结局额外+2。三类天赋每级2点，上限5级；最多继承8门基础武学，成品装备不继承。</p></details></div><div class="card"><h3>跨世回响</h3><div class="row" style="margin:12px 0">${Object.entries(g.meta.echo).map(([k,v])=>tag(({boy:'少年一脉',enemy:'夺剑宿敌',book:'天书批注',lamp:'百世灯火',final:'破命记忆'}[k]||k)+' · '+v,'gold')).join('')||'<small>完成少年、断剑、天书或灯会线，会把因果带到来世。</small>'}</div><p class="description">前十次轮回难度每世增加5%，上限50%；每两世更换敌方战术。可额外选择挑战档。下一世少年、宿敌与忘川房间会读取这些因果。</p></div>${history.length?`<div class="card"><h3>跨世表现 · 只读</h3><div class="archivebar">${history.slice(-12).map(h=>`<div style="height:${Math.max(3,h.score/10)}%" title="第${h.life}世 ${h.score}分"><span>${h.life}世</span></div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>人生</th><th>分数/总入账</th><th>胜率/任务</th><th>探索发现</th></tr></thead><tbody>${history.slice(-20).reverse().map(h=>`<tr><td>${h.life}世 ${esc(h.job)}</td><td>${h.score} / ${h.stats.income}</td><td>${h.stats.fights?Math.round(h.stats.wins/h.stats.fights*100):0}% / ${h.stats.quests}</td><td>${h.stats.explore}次</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="grid">${history.slice().reverse().map(h=>`<article class="card"><div class="eyebrow">第${h.life}世 · ${esc(h.job)}</div><h3>${esc(h.ending)}</h3><p class="description">${h.score}分 · ${h.friends.length?'故人：'+h.friends.map(esc).join('、'):'独行一路'}</p>${h.choices.map(c=>`<p class="description">${esc(c)}</p>`).join('')}<small>前世 → 第${h.life+1}世：${Object.keys(h.echo).map(k=>({boy:'少年后人',enemy:'宿敌追寻',book:'天书线索',lamp:'灯会',final:'破命'}[k]||k)).join('、')||'基础传承'}</small></article>`).join('')||'<div class="empty">此世尚未落幕。六十四回合终结后，第一卷人生会留在这里。</div>'}</div>`;}
function endingsView(){return section('二十六条归途','并行判定，所有达成都收录')+`<div class="grid">${ENDINGS.map(([n,cond,f])=>`<article class="card"><div class="cardhead"><h3>${n}</h3>${tag(G.meta.titles.includes(n)?'已收藏':f(G)?'本世条件已达':'待书写',G.meta.titles.includes(n)?'gold':'')}</div><p class="description">${cond}。</p></article>`).join('')}</div>`;}
function endingView(){const e=G.end;return `<section class="card event"><div class="eyebrow">一世灯火，归入百世书</div><div class="cardhead"><h2>${esc(e.name)}</h2><span class="large-score">${e.score}</span></div><p class="description">${esc(G.name)}，以${DATA.jobs[G.job].name}之身走过${G.done}回合。新增继承点 ${e.points}，本次结算已锁定，不会重复发放。</p><p>同时达成：${e.eligible.map(esc).join('、')||'未竟之旅'}</p><hr class="divider"><div class="row">${['体魄','内息','悟性'].map((n,i)=>btn(n+' '+G.meta.talents[i]+'/5 · 2继承点','inherit',[i],'small',G.meta.points<2||G.meta.talents[i]>=5)).join('')}</div><p class="description">体魄每级生命上限+6，内息每级真气上限+2，悟性每级初始修为+2。</p><div class="row">${btn('再点一盏灯 · 下一世','next',[],'primary')}${btn('导出完整人生','export',[],'ghost')}</div></section>`;}
function coverageView(){return `<div class="card article-copy"><div class="eyebrow">交付边界与实现对照</div><h2>天下棋局 · 实装清单</h2><div class="hint warning">本文件依据本次上传的《完整扩展策划案》独立实现。当前没有上一版H5源码，无法核验或宣称保留旧版93个事件、18门武学的原实现；旧版当前人生不做全量迁移。</div><table><thead><tr><th>策划领域</th><th>本版入口与实现</th></tr></thead><tbody>${[['四幕人生','64回合、每16回合天下大势、四幕目标；免费旅行按章去重。'],['世界观与阵营','残灯天书五步三结局；四阵营任务、世界三属性、市场与关系反馈。'],['六职业','各6专属事件、3层天赋、可转换职业、各有独立终局；伪装身份与阵营潜入。'],['事件导演','50日常、36职业、32地域、30羁绊、24权谋、24隐藏，共196个节点；另16条五步长链80节点。'],['因果后果','即时资源、延迟任务队列、NPC关系与阵营变化、跨世标记；Trace记录触发来源与父子关系。'],['探索与悬案','8地域×3地点；三条剑冢线索与断剑条件保底开启；3悬案×3结案。'],['秘境','四秘境各7房，前6房随机排列、首领收尾；战斗、机关、宝藏、人物、休整、命运；可撤退。'],['武学','4流派、24技能、4套连携、12级流派天赋、3种互斥改造；护盾/毒层/反击/冷却均封顶。'],['传奇武器','断剑与天书任务产出特殊装备；低血破甲、援护反击；铸造上限3级。'],['人物','12 NPC×3个个人节点，每步3种选择；好感/信任/立场/人情；知己、结拜、师徒、宿敌及可选情缘。'],['宗门','8派、3内部派系；7类表决、游说、联盟、战争、停战、缺粮分裂与调停。'],['经营经济','4镖单、路线选择、3—4回合交割、净利保底、容量与配额；6产业各有非银两用途；商品库存与章节供需、融资与合资契约。'],['危机机制','一次行动每种负资源只罚一次并回到安全值；帮工和休整提供恢复路径；生命归零结束人生。'],['天下大势','12种世界事件，四章每章3选1；三种回应按阵营写回世界、物价、人物与宗门。'],['轮回与难度','四类继承、少年三世因果、前世敌人/忘川房间变体；生命成长上限50%、每两世轮换战术。'],['评分与终局','8维度共1000分、封顶计分、26种终局、并行收藏；继承点兑换与等级上限。'],['Trace与档案','因果链筛选、逐轮战斗日志、耗气和护盾建议、历世总入账/胜率/任务/探索对比；只读且本地运行。'],['界面与存档','六组主导航、五种规划界面、移动布局、自动存档与JSON导入导出、教程、收藏与图鉴。']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table><h3>规则选择</h3><p>以本次新策划为准：免费旅行不消耗资源、不触发季节和死亡；押镖履约保底正利润。事件通过行动而不是移动推进。重要抉择预览可知代价，所有结果可回放。</p><h3>兼容说明</h3><p>本版存档可完整恢复，含战斗、秘境和事件队列。旧档仅对明确识别到的继承点做桥接，并完整保留原JSON；不认识的格式直接拒绝，不覆盖现档。旧版当前人生字段映射需原版H5与实际存档核验。</p><h3>验证记录</h3><div id="verification"><p><strong>42组专项规则测试通过，3000局随机回归通过一致性检查。</strong></p>
<p>随机策略累计推进146,676个人生回合、76,014个战斗轮次；1808局走完64回合，1192局提前死亡。该策略刻意探索危险行为与1—14世难度，死亡数不代表真人玩家胜率。状态一致性异常为0，覆盖全部196个事件与12种世界大势。</p>
<p>定向验证覆盖16条长篇×3结局、3悬案×3处置、四秘境分支、四流派八构筑、押镖保本保利、供需限额、金融契约、潜伏成功失败、资源危机去重、存档往返、损坏存档拒绝与继承上限。分支和构筑测试使用已满足前置的条件夹具。</p>
<p>另以正常行动执行26条终局路线（含两世、三世路线），均可达成。界面逻辑测试覆盖102种状态、3530个按钮参数、53种动作，使用VM与DOM接口替身，未进行真实浏览器排版测试。</p>

function settingsView(){return `<div class="card"><h2>随身带走这段江湖</h2><p class="description">每个动作自动保存至浏览器。更换浏览器、移动HTML路径、使用无痕模式或清理站点数据，都可能影响本地进度。建议定期导出JSON。</p><div class="row">${btn('导出完整存档','export',[],'primary')}${btn('导入存档','import')}${btn('下载Trace数据','exportTrace')}</div><hr class="divider"><h3>新手三步</h3><ol class="listclean"><li>在八地免费旅行。初入江湖先探索青石镇旧井，并拜访阿砚。</li><li>用研习、义诊、阵营事务或商贸形成自己的道路。体力与生命不足时休整。</li><li>江湖志列出每条长篇任务的下一地点，优先完成自己关心的两三条线，再考虑终局。</li></ol><p class="description">所有内容分布在多次轮回中，单世64回合不要求清空全图。战斗中的轮次不另耗人生回合，首领可能致命。</p>${G.meta.legacyRaw?'<div class="notice">本档包含完整旧版原始数据，已随导出保留。旧版当前人生未强行映射。</div>':''}</div>`;}
function modalView(){if(modal==='help')return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="行路须知"><div class="cardhead"><h2>行路须知</h2>${btn('关闭','close',[],'small')}</div>${settingsView()}<div class="hint">免费：移动、浏览、编队、流派切换。耗时：探索、故事推进、学习、交易、政治与经营。每回合口粮−1、体力−2；按钮显示其余已知代价。</div></div></div>`;return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="开启人生"><div class="eyebrow">${modal==='next'?'来世，再赴江湖':'一世六十四回合，百世江湖不重样'}</div><h2>这一世，你从何处启程？</h2><p class="description">选择初始道路。以后可以转修，唯有已做的选择会留在身后。</p><div class="jobs">${DATA.jobs.map((j,i)=>btn(`<strong>${j.name}</strong><small>${j.intro}</small>`,'setupJob',[i],'job-choice '+(setupJob===i?'active':''))).join('')}</div><div class="field"><label for="playerName">江湖名</label><input id="playerName" maxlength="16" placeholder="无名客" value="${esc(G?.name==='无名客'?'':G?.name||'')}"><label for="difficulty">挑战</label><select id="difficulty"><option value="0">寻常江湖</option><option value="1">风雨江湖 +15%</option><option value="2">险途江湖 +30%</option></select></div><p class="description">富足开局：生命120、银两420、口粮90、体力90。不同道路有额外初始优势。前世天赋另计。</p><div class="row">${btn(modal==='next'?'再点残灯':'踏入江湖','begin',[],'primary')}${modal==='next'?btn('再看看此世','close',[],'ghost'):btn('已有存档，导入','import',[],'ghost')}</div><p class="readonly" style="margin-top:16px">离线可玩 · 无需账号 · 自动保存与手动导出</p></div></div>`;}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const OPS={scout,rest,train,work,research,healPeople,exploreSite,career,tier,learn,modify,styleTalent,relation,invite,joinFaction,factionWork,joinSect,council,lobby,buildAsset,assetAction,financeAct,infiltrate,escort,trade,investigate,bounty,enterRealm,delve,retreatRealm,chapterReward,finalChallenge,chainAct,battleAct,flee,inherit};
function dispatch(a,args){let res=true;if(OPS[a]){res=OPS[a](G,...args);if(!res)toast('当前条件不足，或有待处理事件。请查看该行动说明。');persist();shell();if(a==='battleAct'&&!G.battle)stopAuto();return;}
if(a==='tab'){tab=args[0];sub=({travel:'map',journal:'quests',people:'',arts:'skills',world:'factions',archive:'lives'})[tab];}
else if(a==='sub'){sub=args[0];}
else if(a==='jump'){[tab,sub]=args;}
else if(a==='move'){if(G.battle||G.realm||G.ended)return;visit(G,args[0]);tab='travel';sub='map';persist();}
else if(a==='choice'){normalizeChoice(G,args[0]);persist();}
else if(a==='style'){if(!G.battle&&!G.ended){G.style=args[0];persist();}}
else if(a==='cover'){G.cover=args[0];persist();}
else if(a==='command'){if(G.battle){G.battle.command=args[0];G.command=args[0];persist();}}
else if(a==='target'){target=args[0];}
else if(a==='endChoice'){G.endChoice=args[0];persist();}
else if(a==='help'){modal='help';}
else if(a==='close'){modal='';}
else if(a==='next'){modal='next';setupJob=G.job;}
else if(a==='setupJob'){const n=$('#playerName')?.value;setupJob=args[0];shell();if(n)$('#playerName').value=n;return;}
else if(a==='begin'){const name=($('#playerName')?.value||'无名客').slice(0,16),diff=+($('#difficulty')?.value||0);G=modal==='next'?reincarnate(G,setupJob,diff):newGame(setupJob,Date.now()>>>0,newMeta(),diff);G.name=name;modal='';tab='travel';sub='map';persist();toast('已启程。先探索旧城井，或在江湖志选择一条故事线。');}
else if(a==='save'){persist();toast(storageOK?'进度已保存在当前浏览器。':'自动保存不可用，请导出存档。');}
else if(a==='export'){download('残灯江湖_第'+G.meta.life+'世_'+G.done+'回合.json',saveEnvelope(G));return;}

 checkRealm();checkAch();patchBadge();if(panel)renderPanel();
}
var prev=snap();
setInterval(function(){var cur=snap();if(!cur){prev=null;return;}if(prev){try{diff(prev);}catch(e){console.error('[v14]',e);}}prev=cur;},400);
/* ---- 爽感面板 ---- */
var btn=document.createElement('button');btn.id='v14btn';btn.textContent='爽感 · 成就';document.body.appendChild(btn);
var panel=null,pTab='ach';
btn.addEventListener('click',function(ev){ev.stopPropagation();if(panel){panel.remove();panel=null;return;}panel=document.createElement('div');panel.id='v14panel';document.body.appendChild(panel);renderPanel();});
document.addEventListener('click',function(ev){if(!panel)return;var t=ev.target.getAttribute&&ev.target.getAttribute('data-v14t');if(!t)return;ev.stopPropagation();if(t==='mute'){muted=!muted;store('mute',muted);}else pTab=t;renderPanel();},true);
function renderPanel(){if(!panel)return;var s=S(),done=store('ach')||{},d=taskData(),dl=store('daily')||{streak:0};
 var h='<h3>爽感系统 V14<span><button data-v14t="mute" style="font-size:11px;min-height:26px;padding:2px 8px">'+(muted?'音效：关':'音效：开')+'</button></span></h3>';
 h+='<div class="v14tabs">'+[['ach','成就'],['day','今日'],['realm','境界']].map(function(t){return '<button data-v14t="'+t[0]+'" class="'+(pTab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('')+'</div>';
 if(pTab==='ach'){var n=ACH.filter(function(a){return done[a[0]];}).length;h+='<p><small>已达成 '+n+' / '+ACH.length+'，达成即发放奖励</small></p>';
  ACH.forEach(function(a){var ok=!!done[a[0]];h+='<div class="v14ach'+(ok?' done':'')+'"><div class="ic">'+(ok?'★':'◇')+'</div><div><b>'+a[1]+'</b><small>'+a[2]+'</small><span class="rw">奖励：'+a[3]+'</span></div></div>';});}
 else if(pTab==='day'){h+='<p><small>连续签到 '+dl.streak+' 天 · 累计击破 '+kills+' 敌</small></p>';
  TASKS.forEach(function(t){var c=Math.min(t[2],d.n[t[0]]||0);h+='<div class="v14task"><b style="font-size:13px">'+t[1]+(d.done[t[0]]?' ✓':'')+'</b><div class="v14bar"><i style="width:'+(c/t[2]*100)+'%"></i></div><small>'+c+'/'+t[2]+' · 奖励 '+t[3]+'</small></div>';});
  h+='<p><small>活跃任务随自然日刷新；签到奖励随连续天数递增。</small></p>';}
 else{var idx=s?realmIdx(s.r.training):0;REALMS.forEach(function(r,i){h+='<div class="v14ach'+(i<=idx?' done':'')+'"><div class="ic">'+(i<idx?'✦':i===idx?'◆':'·')+'</div><div><b>'+r[1]+'</b><small>修为 '+r[0]+' 达成'+(i===idx?' · 当前境界':'')+'</small></div></div>';});
  h+='<p><small>突破境界：生命真气全满，上限提升，另赐银两名望。</small></p>';}
 panel.innerHTML=h;
}
setTimeout(function(){checkDaily();checkRealm();patchBadge();checkAch();},400);
})();
</script>
