[adk]
# 相对路径均以本配置文件所在目录为基准解析。
runtime_dir=../runtime/ADK
# 已验证的厂商示例抓包使用 INI 监听器路径，而不是
# 显式 ConfigureRepeater 路径；完整的 14 端口配置由 ADKCore 管理。
bootstrap=ini
managed_ini=true
# 仅探测中继台，避免扫描 USB/移动终端适配器。
detector_type=2
# 保持通配监听。中继台必须在 CPS 中配置为向下方 network.local_ip 发送数据；
# 此处不要填写中继台 IP。
listener_ip=0.0.0.0

[network]
# 本机有线网卡 IPv4；CPS 中的第三方服务器 IP 必须与其一致。
# 原始成功示例抓包目标为 192.168.64.110，而当前配置为 .46。
# 在当前电脑使用前，请同步修改 CPS 为 .46。
local_ip=192.168.64.46

[ports]
# 来自 ADKCoreEngineDemo V5 成功抓包的已验证监听端口配置。
# CPS 中每个 API 端口必须按时隙与这里逐项一致。
rrs_slot1=30001
rrs_slot2=30002
lp_slot1=30003
lp_slot2=30004
tp_slot1=30005
tp_slot2=30006
tmp_slot1=30007
tmp_slot2=30008
rcp_slot1=30009
rcp_slot2=30010
rtp_slot1=30012
rtp_slot2=30014
self_define_slot1=3017
self_define_slot2=3018

[audio]
mode=adk_audio
input_device=0
output_device=0
play_flag=0

[behaviour]
auto_channel=true
auto_attach_audio=true

[rrs]
auto_ack=true
registration_valid_time=60

[server]
# FastAPI HTTP 服务。ADK DLL 独占 UDP socket，只能使用单进程/单 worker。
host=127.0.0.1
port=18081
watchdog_interval_seconds=2.0
thread_join_timeout_seconds=3.0
event_history_size=500
error_history_size=100

[protobuf_tools]
# 原始二进制转短信接口的边界参数；默认值保持原有行为。
max_request_bytes=1048576
private_target_id=5
send_timeout_seconds=15.0

[channel]
# auto：仅使用 ADK 实际发现的通道；default：固定默认通道；
# auto_then_default：优先自动发现，未发现时使用默认通道。
mode=auto
# 支持十进制或 0x 前缀十六进制；留空表示不配置。
default_channel_id=
default_slot1_channel_id=
default_slot2_channel_id=
# 语音/PTT/RTP 默认禁止使用未经 ADK 发现的回退通道。
fallback_for_voice=false

[recording]
# ADK Audio.dll 负责扬声器/麦克风实时桥接；HTTP 服务还会把
# ADK 回调暴露的二进制语音载荷保存到该目录。
dir=../runtime/recordings
wav_sample_rate=8000
wav_channels=1
wav_sample_width=2
# 仅当接收载荷已经是解码后的 PCM 时才设为 true。
wav_assume_pcm=false
# 可选原始 UDP 录制器。仅当中继台把 RTP/PCM 镜像到独立端口，
# 或 ADK 未绑定这些端口时启用；否则可能与原生 ADK RTP 监听器冲突。

udp_recording_enabled=false
udp_recording_bind_ip=0.0.0.0
# 留空时使用 [ports] 中的 rtp_slot1 和 rtp_slot2。
udp_recording_ports=31012,31014

[voice_capture]
# 服务启动后自动启动 TShark 抓包。请先运行 tshark -D 确认本机网卡编号。
auto_start=true
# 默认沿用之前示例里的网卡编号；如不匹配，请改成 tshark -D 看到的真实编号或名称。
iface=5
# 空值表示默认使用 [ports] 中的 rtp_slot1/rtp_slot2。
ports=30012,30014
# 可选过滤。一般 src_ip 为中继台 IP，dst_ip 为本机 ADK 电脑 IP。
src_ip=192.168.64.230
dst_ip=192.168.64.46
host=
strict_direction=false
# 抓包根目录和发送 WAV 的保存目录，均相对本配置文件解析。
root_dir=../voice_capture
send_dir=../voice_capture/sent
out_dir=
tshark_path=

[voice_callback]
# 回调地址。填入后，后台线程会按 interval_seconds 定时读取新增音频包并 POST 到该地址。
# 也可以运行中通过 POST /voice/info 动态设置 callback_url。
# 如果 callback_receiver.py 和网关在同一台电脑，保持 127.0.0.1 即可；
# 如果不在同一台电脑，请改成接收端电脑的局域网 IP。
enabled=true
url=http://127.0.0.1:18082/voice/callback
# 兼容旧习惯：config.py 现在也支持 callback_url 这个键名。
interval_seconds=1.0
timeout_seconds=5.0    
max_packets_per_tick=500
# 连续 RTP 合并参数。默认在静音间隔达到阈值后发送一次回调。
# 0.4s 静音即高置信判定说话结束，配合细粒度 tick 静音确认总时长 <1s。
merge_continuous_audio=true
merge_gap_seconds=0.4
# 500 包（约 30s）会把长指令切成多段独立回调，导致 ASR 转写被截断、
# 后续段落无法归入同一通话会话。2000 包 ≈ 2 分钟长语音不被强制切段；
# 配合 merge_max_audio_bytes 同步放宽（2000 包 × 480B ≈ 960KB，8MB 留足余量）。
merge_max_packets=2000
merge_max_audio_bytes=8388608
merge_flush_on_idle_tick=true
merge_flush_on_batch_end=false
fallback_read_audio_raw=true
