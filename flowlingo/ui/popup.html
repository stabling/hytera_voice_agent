<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowLingo · 无感英语</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="heading">
    <img src="../assets/icon48.png" alt="" width="39" height="39">
    <div class="brand"><strong>FlowLingo</strong><small>AMBIENT ENGLISH · PRIVATE EDITION</small></div>
    <div id="statusPill" class="status">学习中</div>
  </header>
  <section class="hero">
    <span class="eyebrow">LANGUAGE, IN DAILY LIFE</span>
    <h1>不改变你的日常，<br><em>只增加一点英语。</em></h1>
    <p>浏览文章、资料与视频时，让英语在熟悉的语境中自然出现。</p>
    <div class="stat-row">
      <div><strong id="exposures">0</strong><small>累计英语接触</small></div>
      <div><strong id="wordCount">0</strong><small>生词记录</small></div>
      <div><strong id="dueCount">0</strong><small>待复习</small></div>
    </div>
  </section>
  <main>
    <div class="setting switch-row">
      <div><strong>全局学习开关</strong><small>开启后在支持的网页自动工作</small></div>
      <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
    </div>
    <div class="setting switch-row">
      <div><strong>在当前网站启用</strong><small id="hostname">读取当前页面…</small></div>
      <label class="switch"><input type="checkbox" id="siteEnabled"><span></span></label>
    </div>
    <div class="setting">
      <label for="intensity">英语接触强度 <strong class="value" id="intensityVal">18%</strong></label>
      <input id="intensity" type="range" min="3" max="55" step="1">
      <div class="range-label"><span>轻量陪伴</span><span>沉浸输入</span></div>
    </div>
    <div class="two">
      <div class="setting">
        <label for="level">当前英语水平</label>
        <select id="level">
          <option value="1">A1 · 基础</option>
          <option value="2">A2 · 初级</option>
          <option value="3">B1 · 中级</option>
          <option value="4">B2 · 进阶</option>
          <option value="5">C1 · 高级</option>
        </select>
      </div>
      <div class="setting">
        <label for="pageMode">网页学习模式</label>
        <select id="pageMode">
          <option value="auto">智能识别语言</option>
          <option value="zh">中文 → 英文</option>
          <option value="en">英文生词标注</option>
        </select>
      </div>
    </div>
    <div class="setting switch-row last">
      <div><strong>视频学习字幕</strong><small>YouTube · Bilibili · Netflix（尽力兼容）</small></div>
      <label class="switch"><input id="videoEnabled" type="checkbox"><span></span></label>
    </div>
    <button id="openDashboard" class="dashboard-btn">进入学习中心 <span>↗</span></button>
    <div class="footer"><span id="note">离线词典已就绪 · AI 可选</span><span>v1.0</span></div>
  </main>
  <script src="../scripts/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
